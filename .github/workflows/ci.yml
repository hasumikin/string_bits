name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    # Ruby head is not tested. This gem is a prototype for a String API proposed
    # for Ruby core, so the versions that matter are the released ones people
    # would install it on; once the API lands in core the gem stops being the
    # thing under test. Tracking head only reported breakage originating
    # outside this repo (most recently `bundle install` failing because head
    # removed Pathname::SEPARATOR_PAT, which the bundled Bundler still uses).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.4.3', '4.0.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  test-bigendian:
    name: Big-endian (s390x via QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x
      - name: Run tests inside s390x container
        run: |
          docker run --rm --platform linux/s390x \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ruby:3.4 \
            sh -c "gem install bundler --no-document && bundle install && bundle exec rake"

  test-32bit:
    name: 32-bit (i386 / ILP32)
    # Guards the ssize_t bit-length arithmetic: on an ILP32 build `bytesize * 8`
    # overflows a signed 32-bit integer for strings >= 256 MiB. amd64 runners
    # execute i386 containers natively, so no QEMU is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests inside i386 container
        run: |
          docker run --rm --platform linux/386 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            i386/ruby:3.4 \
            sh -c "gem install bundler --no-document && bundle install && bundle exec rake"

  test-arm32:
    name: 32-bit ARM (armv7 / ILP32 via QEMU)
    # Same ILP32 bit-length overflow guard as test-32bit, on a different arch.
    # ARM is a primary target for the embedded Ruby implementations this API is
    # meant to be shared with. amd64 runners need QEMU to execute armv7.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Run tests inside armv7 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            arm32v7/ruby:3.4 \
            sh -c "gem install bundler --no-document && bundle install && bundle exec rake"

  test-msvc-avx:
    name: MSVC + AVX (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile AVX popcount test with MSVC
        run: cl /nologo /arch:AVX /O2 /Fe:avx_test.exe test\msvc_avx_test.c
        shell: cmd
      - name: Run AVX popcount test
        run: .\avx_test.exe
        shell: cmd
