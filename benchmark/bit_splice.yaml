prelude: |
  $LOAD_PATH.unshift File.expand_path('lib')
  require 'string_bits'
  # Scenario: copy a 50 KB buffer into a destination with a 3-bit offset.
  # This is the core use case for bit_splice: a single large unaligned bit-range
  # copy that cannot be expressed as a simple byte operation.
  # The baseline must loop over every byte in pure Ruby, crossing the C boundary
  # 4*N_BYTES times.  bit_splice crosses it once.
  BIT_OFFSET = 3
  N_BYTES    = 50_000
  BIT_LEN    = N_BYTES * 8
  DST_BYTES  = N_BYTES + 1
  SRC        = Array.new(N_BYTES) { |i| i & 0xFF }.pack('C*').b
  SHIFT      = BIT_OFFSET
  ANTI       = 8 - SHIFT
  KEEP_LO    = (1 << SHIFT) - 1
  KEEP_HI    = (~KEEP_LO) & 0xFF

benchmark:
  baseline: |
    dst = ("\x00" * DST_BYTES).b
    N_BYTES.times do |i|
      byte = SRC.getbyte(i)
      dst.setbyte(i,     (dst.getbyte(i)     & KEEP_LO) | ((byte << SHIFT) & 0xFF))
      dst.setbyte(i + 1, (dst.getbyte(i + 1) & KEEP_HI) | (byte >> ANTI))
    end
    dst
  string_bits: |
    dst = ("\x00" * DST_BYTES).b
    dst.bit_splice(BIT_OFFSET, BIT_LEN, SRC, lsb_first: true)
    dst
